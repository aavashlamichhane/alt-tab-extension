<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator - Edge Alt-Tab</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f0f0; }
    canvas { display: none; }
    .btn { 
      display: inline-block; padding: 10px 20px; margin: 10px; 
      background: #0078d4; color: white; border-radius: 5px; 
      text-decoration: none; font-weight: bold;
    }
    .btn:hover { background: #005a9e; }
  </style>
</head>
<body>
  <h1>Edge Alt-Tab Icon Generator</h1>
  <p>Open this file in your browser and click the buttons to download your icons.</p>
  <div id="buttons"></div>

  <script>
    const sizes = [16, 32, 48, 128];
    const container = document.getElementById('buttons');

    sizes.forEach(size => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Draw Icon
      const r = size * 0.2; // Rounded corners
      ctx.fillStyle = '#0078d4';
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size-r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size-r);
      ctx.quadraticCurveTo(size, size, size-r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size-r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.fill();

      // Draw "Tab" shapes
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      const tabW = size * 0.5;
      const tabH = size * 0.35;
      const padding = size * 0.15;
      
      // Top Tab
      ctx.fillRect(padding, padding + size*0.05, tabW, tabH);
      
      // Bottom Tab (outline)
      ctx.strokeStyle = '#0078d4';
      ctx.lineWidth = size * 0.05;
      ctx.strokeRect(padding + size*0.15, padding + size*0.2, tabW, tabH);
      ctx.fillStyle = '#0078d4';
      ctx.fillRect(padding + size*0.15, padding + size*0.2, tabW, tabH);
      ctx.strokeStyle = 'white';
      ctx.strokeRect(padding + size*0.15, padding + size*0.2, tabW, tabH);

      // Create Download Link
      const link = document.createElement('a');
      link.className = 'btn';
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.innerText = `Download icon${size}.png`;
      container.appendChild(link);
    });
  </script>
</body>
</html>
